<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>活动列表</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- <script type="text/javascript" src="https://api.map.baidu.com/api?v=2.0&amp;ak=q7LFs3kP1PNSP0ccE0etjLErsIN8GzjD&amp;s=1"></script> -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container all-activity">
        <h2 class="title">全部活动</h2>

        <!-- 筛选 -->
        <div class="filters">
            <div class="custom-select" id="storeSelect">
                <div class="select-trigger"></div>
                <div class="select-options">
                </div>
            </div>

            <div class="custom-select" id="typeSelect">
                <div class="select-trigger">新品体验</div>
                <div class="select-options">
                    <div data-vaule="新品体验" data-sort="0">新品体验</div>
                    <div data-vaule="促销活动" data-sort="1">促销活动</div>
                </div>
            </div>
        </div>

        <!-- 列表 -->
        <div class="card-list" id="cardList"></div>

        <!-- 暂无活动提示 -->
        <div class="no-activity" id="noActivity" style="display: none;">
            <div class="no-activity-text">暂无活动</div>
        </div>

        <!-- 分页 -->
        <div class="pagination" id="pagination">
            <span class="prev">&lt;</span>
            <span class="current">1</span>
            <span class="total">共 1 页</span>
            <span class="next">&gt;</span>
        </div>

        <!-- 加载更多按钮（移动端） -->
        <div class="load-more" id="loadMore">
            <span class="load-more-text">加载更多</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
