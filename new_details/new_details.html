<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>活动列表</title>
    <link rel="stylesheet" href="https://unpkg.com/swiper@7.4.1/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://api.map.baidu.com/library/SearchInfoWindow/1.5/src/SearchInfoWindow_min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container store-detail">
        <!-- 地图区域 -->
        <div class="map-section">
            <div class="breadcrumb">
                <span>索尼在线商城</span>
                <span>></span>
                <a href="index.html">门店查找</a>
                <span>></span>
                <span id="breadcrumbStoreName">加载中...</span>
            </div>
            <div class="map-nav">
                <div class="map-nav-right">
                    <select class="store-select" id="storeSelect">
                        <option value="0">选择其他直营店</option>
                    </select>
                </div>
            </div>

            <div class="map-zone">
                <div class="map-display active" id="storeImage">
                    <img src="https://via.placeholder.com/862x500?text=Store+Image" alt="门店图片" id="storeImg">
                </div>
                <div class="map-display" id="mapContainer">
                    <div id="map"></div>
                </div>

                <div class="map-control">
                    <a href="javascript:void(0)" class="active" data-target="storeImage">门店实景</a>
                    <a href="javascript:void(0)" data-target="mapContainer">地图</a>
                </div>
            </div>
        </div>

        <div class="header-info" id="storeInfo">
        </div>
        <div class="divider"></div>

        <h2 class="section-title">Alpha俱乐部</h2>
        <div class="swiper activity-swiper">
            <div class="swiper-wrapper" id="alphaList"></div>
        </div>

        <h2 class="section-title experience-title">体验活动</h2>
        <div class="swiper experience-swiper">
            <div class="swiper-wrapper" id="experienceList"></div>
        </div>

        <h2 class="section-title promo-title">促销活动</h2>
        <div class="tabs-container">
            <div class="tabs" id="promoTabs"></div>
        </div>
        <div class="tab-panels">
            <div class="swiper promo-swiper">
                <div class="swiper-wrapper" id="promoList"></div>
            </div>
        </div>

        <h2 class="section-title storelist-title">更多门店</h2>
        <div class="store-container">
            <div class="swiper store-swiper">
                <div class="swiper-wrapper" id="storeList"></div>
                <div class="swiper-scrollbar"></div>
            </div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/swiper@7.4.1/swiper-bundle.min.js"></script>
    <script type="text/javascript"
        src="https://api.map.baidu.com/api?v=2.0&ak=q7LFs3kP1PNSP0ccE0etjLErsIN8GzjD&s=1"></script>
    <script type="text/javascript"
        src="https://api.map.baidu.com/library/SearchInfoWindow/1.5/src/SearchInfoWindow_min.js"></script>
    <script src="script.js"></script>
</body>

</html>
