<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>活动列表</title>
    <link rel="stylesheet" href="https://unpkg.com/swiper@7.4.1/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://api.map.baidu.com/library/SearchInfoWindow/1.5/src/SearchInfoWindow_min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container store-detail">
        <!-- 地图区域 -->
        <div class="map-section">
            <div class="breadcrumb">
                <span>索尼在线商城</span>
                <span>></span>
                <a href="index.html">门店查找</a>
                <span>></span>
                <span id="breadcrumbStoreName">加载中...</span>
            </div>
            <div class="map-nav">
                <div class="map-nav-right">
                    <select class="store-select" id="storeSelect">
                        <option value="0">选择其他直营店</option>
                    </select>
                </div>
            </div>

            <div class="map-zone">
                <div class="map-display active" id="storeImage">
                    <img src="https://via.placeholder.com/862x500?text=Store+Image" alt="门店图片" id="storeImg">
                </div>
                <div class="map-display" id="mapContainer">
                    <div id="map"></div>
                </div>

                <div class="map-control">
                    <a href="javascript:void(0)" class="active" data-target="storeImage">门店实景</a>
                    <a href="javascript:void(0)" data-target="mapContainer">地图</a>
                </div>
            </div>
        </div>

        <div class="header-info" id="storeInfo">
        </div>
        <div class="divider"></div>

        <h2 class="section-title">Alpha俱乐部</h2>
        <div class="swiper activity-swiper">
            <div class="swiper-wrapper" id="alphaList"></div>
        </div>

        <h2 class="section-title experience-title">体验活动</h2>
        <div class="swiper experience-swiper">
            <div class="swiper-wrapper" id="experienceList"></div>
        </div>

        <h2 class="section-title promo-title">促销活动</h2>
        <div class="tabs-container">
            <div class="tabs" id="promoTabs"></div>
        </div>
        <div class="tab-panels">
            <div class="swiper promo-swiper">
                <div class="swiper-wrapper" id="promoList"></div>
            </div>
        </div>

        <h2 class="section-title storelist-title">更多门店</h2>
        <div class="store-container">
            <div class="swiper store-swiper">
                <div class="swiper-wrapper" id="storeList"></div>
                <div class="swiper-scrollbar"></div>
            </div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
        </div>
    </div>

    <!-- 报名弹窗 -->
    <div class="pop_m" id="success" style="display:none;">
        <a href="javascript:void(0)" class="close" title="关闭">关闭</a>
        <div class="pop_content gerenxinxi">
            <div class="pop_main">
                <div class="pop_con">
                    <div class="pop_title">
                        您正在报名，请核实个人信息
                    </div>
                    <div class="pop_c4 clearfix">
                        <p>用户名：<span class="yhm"> </span></p>
                        <p>联系电话：<span class="stmobile"></span></p>
                        <p>E-mail地址：<span class="email"> </span></p>
                        <p>真实姓名：<span class="tname"> </span></p>
                    </div>
                    <a href="javascript:void(0)" class="correctinfo" title="个人信息正确">个人信息正确</a>
                    <div class="pop_c5 clearfix">
                        <div class="edit_c">
                            如个人信息不正确，请点
                            <a href="/b2c_sony/b2c/member/z_recommendProduct.do" target="_blank" title="修改">此处修改</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="pop_content bmcg" style="display:none;">
            <div class="pop_main">
                <div class="pop_con">
                    <div class="pop_title">
                        报名成功
                    </div>
                    <div class="pop_c1">
                        <p>亲爱的用户：</p>
                        <p>感谢您的关注，您的报名已成功！</p>
                    </div>
                    <div class="pop_c2">
                        <p>课程：<span class="bm_title"></span></p>
                        <p>地点：<span class="bm_space"></span></p>
                        <p>时间：<span class="bm_time"></span></p>
                    </div>
                </div>
                <div class="pop_bpad">
                    <div class="pop_bottom">
                        <p class="pt_1">注意事项：</p>
                        <p>60岁以上老人请在家属陪同下前往参加；</p>
                        <p>请避免携带15岁以下孩童参加。</p>
                        <p>感谢您的支持和配合！</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="pop_m" id="ybaomingl" style="display:none;">
        <a href="javascript:void(0)" class="close" title="关闭">关闭</a>
        <div class="pop_content">
            <div class="pop_main">
                <div class="pop_con">
                    <div class="pop_c3">
                        <p class="finish1 error_mess"></p>
                        <p class="finish2"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/swiper@7.4.1/swiper-bundle.min.js"></script>
    <script type="text/javascript"
        src="https://api.map.baidu.com/api?v=2.0&ak=q7LFs3kP1PNSP0ccE0etjLErsIN8GzjD&s=1"></script>
    <script type="text/javascript"
        src="https://api.map.baidu.com/library/SearchInfoWindow/1.5/src/SearchInfoWindow_min.js"></script>
    <script src="/content/dam/sonystyle/smallapp/dealerweb/js/jquery.bpopup-0.7.0.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
